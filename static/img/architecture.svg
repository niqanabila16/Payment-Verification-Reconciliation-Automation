<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="t d" font-family="Segoe UI, system-ui, Arial, sans-serif">
  <title id="t">Software architecture diagram</title>
  <desc id="d">Teller, Finance and Admin use a browser front end that talks to a Django back end with a matching engine, backed by a database, cache and optional SMTP. Finance downloads bank statements manually.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Software Architecture Diagram</text>

  <!-- Users -->
  <g font-size="13" fill="#334155" text-anchor="middle">
    <circle cx="160" cy="78" r="9" fill="#64748b"/><text x="160" y="106">Teller (branches)</text>
    <circle cx="330" cy="78" r="9" fill="#64748b"/><text x="330" y="106">Finance</text>
    <circle cx="500" cy="78" r="9" fill="#64748b"/><text x="500" y="106">Admin</text>
  </g>
  <path d="M160 116V150M330 116V150M500 116V150" stroke="#1f2937" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- Frontend -->
  <rect x="90" y="156" width="270" height="116" rx="12" fill="#eef4ff" stroke="#a9c3f5" stroke-width="2"/>
  <text x="225" y="186" text-anchor="middle" font-size="17" font-weight="700" fill="#1849a9">Frontend (Browser)</text>
  <g font-size="11.5" fill="#1849a9" text-anchor="middle">
    <rect x="104" y="200" width="112" height="22" rx="11" fill="#dbe7ff"/><text x="160" y="215">Django templates</text>
    <rect x="224" y="200" width="122" height="22" rx="11" fill="#dbe7ff"/><text x="285" y="215">Vanilla JavaScript</text>
    <rect x="104" y="230" width="112" height="22" rx="11" fill="#dbe7ff"/><text x="160" y="245">Service worker</text>
    <rect x="224" y="230" width="122" height="22" rx="11" fill="#dbe7ff"/><text x="285" y="245">CSS design tokens</text>
  </g>

  <!-- Backend -->
  <rect x="470" y="156" width="330" height="136" rx="12" fill="#e9f8ef" stroke="#a7dcc0" stroke-width="2"/>
  <text x="635" y="186" text-anchor="middle" font-size="17" font-weight="700" fill="#146c43">Backend (Python 3.12 + Django 5.2)</text>
  <g font-size="11.5" fill="#146c43" text-anchor="middle">
    <rect x="484" y="200" width="142" height="22" rx="11" fill="#cdeedb"/><text x="555" y="215">Auth + role access</text>
    <rect x="634" y="200" width="152" height="22" rx="11" fill="#cdeedb"/><text x="710" y="215">Statement parser</text>
    <rect x="484" y="230" width="142" height="22" rx="11" fill="#cdeedb"/><text x="555" y="245">Matching engine</text>
    <rect x="634" y="230" width="152" height="22" rx="11" fill="#cdeedb"/><text x="710" y="245">Import thread</text>
    <rect x="484" y="260" width="142" height="22" rx="11" fill="#cdeedb"/><text x="555" y="275">Notifications</text>
    <rect x="634" y="260" width="152" height="22" rx="11" fill="#cdeedb"/><text x="710" y="275">Audit log (append-only)</text>
  </g>

  <!-- Frontend <-> Backend -->
  <path d="M362 200H468" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M468 232H362" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="415" y="192" text-anchor="middle" font-size="11" fill="#475569">HTTPS</text>

  <!-- Resources -->
  <rect x="330" y="420" width="190" height="96" rx="12" fill="#fff7e0" stroke="#f0cf86" stroke-width="2"/>
  <text x="425" y="452" text-anchor="middle" font-size="16" font-weight="700" fill="#8a4b00">SQLite / PostgreSQL</text>
  <text x="425" y="474" text-anchor="middle" font-size="12" fill="#475569">Primary database</text>
  <text x="425" y="494" text-anchor="middle" font-size="11" fill="#475569">Django ORM + migrations</text>

  <rect x="545" y="420" width="190" height="96" rx="12" fill="#fdeceb" stroke="#f4b4ae" stroke-width="2"/>
  <text x="640" y="452" text-anchor="middle" font-size="16" font-weight="700" fill="#b42318">Local memory cache</text>
  <text x="640" y="474" text-anchor="middle" font-size="12" fill="#475569">Sign-in throttling</text>
  <text x="640" y="494" text-anchor="middle" font-size="11" fill="#475569">Redis + RQ: optional Phase 2</text>

  <rect x="760" y="420" width="190" height="96" rx="12" fill="#f3efff" stroke="#cdbff0" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="855" y="452" text-anchor="middle" font-size="16" font-weight="700" fill="#5b36b5">SMTP e-mail</text>
  <text x="855" y="474" text-anchor="middle" font-size="12" fill="#475569">Optional result digest</text>
  <text x="855" y="494" text-anchor="middle" font-size="11" fill="#475569">Reaches users outside the site</text>

  <path d="M560 294V418" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)" fill="none"/>
  <path d="M584 418V296" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)" fill="none"/>
  <path d="M520 292L450 418" stroke="#1f2937" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M700 294L650 418" stroke="#1f2937" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M770 294L850 418" stroke="#1f2937" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- Manual bank step -->
  <rect x="90" y="420" width="200" height="96" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="190" y="452" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Bank website</text>
  <text x="190" y="474" text-anchor="middle" font-size="12" fill="#475569">No API access (constraint)</text>
  <text x="190" y="494" text-anchor="middle" font-size="11" fill="#475569">CSV / XLSX downloaded by hand</text>
  <path d="M190 418V300" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow-dash)"/>
  <text x="200" y="372" font-size="11.5" fill="#475569">Finance uploads the file</text>

  <!-- Legend -->
  <rect x="90" y="552" width="860" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <g font-size="12" fill="#334155">
    <text x="108" y="576" font-weight="700">Legend</text>
    <rect x="108" y="588" width="12" height="12" rx="3" fill="#2554e8"/><text x="126" y="598">Frontend components</text>
    <rect x="290" y="588" width="12" height="12" rx="3" fill="#16a05d"/><text x="308" y="598">Backend services</text>
    <rect x="450" y="588" width="12" height="12" rx="3" fill="#e0a100"/><text x="468" y="598">Database resources</text>
    <line x1="610" y1="594" x2="650" y2="594" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/><text x="658" y="598">Automatic data flow</text>
    <line x1="790" y1="594" x2="830" y2="594" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-dash)"/><text x="838" y="598">Manual step</text>
  </g>
</svg>
