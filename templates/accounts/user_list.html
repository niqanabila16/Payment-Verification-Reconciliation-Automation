{% extends "base.html" %}{% load ui %}
{% block title %}Users{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Users</h1>
  <div class="page-head__actions"><a class="btn btn--primary" href="{% url 'accounts:user_create' %}">{% icon "plus" %} Add user</a></div>
</div>
<div class="card card--flush">
  <form class="filters" method="get" role="search" data-live-search>
    <label class="visually-hidden" for="q">Search users</label>
    <input class="input input--grow" id="q" name="q" value="{{ q }}" placeholder="Search by name or email" type="search" autocomplete="off">
    <label class="visually-hidden" for="role">Role</label>
    <select class="input" id="role" name="role"><option value="">All roles</option>{% for value, label in roles %}<option value="{{ value }}" {% if value == role %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>
    <label class="visually-hidden" for="state">Status</label>
    <select class="input" id="state" name="state"><option value="">Active and inactive</option><option value="active" {% if state == "active" %}selected{% endif %}>Active</option><option value="inactive" {% if state == "inactive" %}selected{% endif %}>Inactive</option></select>
    <button class="visually-hidden" type="submit">Search</button>
  </form>
  <div data-live-results>{% include "accounts/_user_results.html" %}</div>
</div>
{% endblock %}
