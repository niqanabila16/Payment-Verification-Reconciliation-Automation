{% load static ui %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password | Payment Reconciliation</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v=4">
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
</head>
<body>
  {% include "components/icons.html" %}
  <div class="auth">
    <main class="auth__form" id="main">
      <form method="post" novalidate>
        {% csrf_token %}
        <h1>Forgot password</h1>
        {% include "components/error_summary.html" %}
        {% include "components/field.html" with field=form.email %}
        <button class="btn btn--primary btn--block" type="submit" data-submit-btn data-loading-text="Sending...">Send link</button>
        <p class="link-row"><a href="{% url 'accounts:login' %}">Back to sign in</a></p>
      </form>
    </main>
  </div>
  <script src="{% static 'js/app.js' %}?v=4" defer></script>
</body>
</html>
