{% extends "base.html" %}{% load ui %}
{% block title %}Audit trail{% endblock %}
{% block content %}
<div class="page-head"><h1>Audit trail</h1></div>
<div class="card card--flush">
  <form class="filters" method="get" role="search" data-live-search><label class="visually-hidden" for="q">Filter</label>
    <input class="input input--grow" id="q" name="q" type="search" value="{{ q }}" placeholder="Filter by action, record type or person" autocomplete="off">
    <button class="visually-hidden" type="submit">Filter</button></form>
  <div data-live-results>{% include "accounts/_audit_results.html" %}</div>
</div>
{% endblock %}
