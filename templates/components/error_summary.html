{# Form-level messages (not tied to one field), as a calm notice. Field errors are shown under their own field. #}
{% if form.non_field_errors %}
<div class="error-summary" id="error-summary" role="alert" tabindex="-1" data-focus-on-load>
  <ul>{% for error in form.non_field_errors %}<li>{{ error }}</li>{% endfor %}</ul>
</div>
{% endif %}
