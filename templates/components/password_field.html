{% load ui %}
{# Password field with a show/hide button (same anatomy as components/field.html) #}
{% with key=field.auto_id|slice:"3:" %}
<div class="field">
  <label class="field__label" for="{{ field.id_for_label }}">{{ field.label }}<span class="field__req" aria-hidden="true">*</span><span class="visually-hidden"> (required)</span></label>
  {% if field.errors %}<div class="field__error" id="error-{{ key }}">{% icon "x-circle" %}<span><span class="visually-hidden">Error: </span>{{ field.errors.0 }}</span></div>{% endif %}
  <div class="password-wrap">
    {{ field }}
    <button type="button" class="password-toggle" data-toggle-password aria-label="Show password" aria-pressed="false">{% icon "eye" %}</button>
  </div>
</div>
{% endwith %}
