{% extends "base.html" %}{% load ui %}
{% block title %}Log receipt{% endblock %}
{% block content %}
<div class="page-head"><h1>Log receipt</h1>
  <div class="page-head__actions"><a class="btn btn--primary" href="{% url 'receipts:new' %}">{% icon "plus" %} New receipt</a></div></div>
<div class="card card--flush">
  <form class="filters" method="get" role="search" data-live-search>
    <label class="visually-hidden" for="q">Search receipts</label>
    <input class="input input--grow" id="q" name="q" type="search" value="{{ q }}" placeholder="Search by reference or name" autocomplete="off">
    <label class="visually-hidden" for="status">Status</label>
    <select class="input" id="status" name="status"><option value="">All statuses</option>{% for v, l in statuses %}<option value="{{ v }}" {% if v == status %}selected{% endif %}>{{ l }}</option>{% endfor %}</select>
    <button class="visually-hidden" type="submit">Search</button>
  </form>
  <div data-live-results>{% include "receipts/_list_results.html" %}</div>
</div>
{% endblock %}
