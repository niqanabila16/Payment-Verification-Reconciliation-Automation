services:
  postgres:
    image: postgres:16
    container_name: reconciliation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reconciliation_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-reconciliation_db}
    ports:
      - "5432:5432"
    volumes:
      - reconciliation_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reconciliation_user}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: reconciliation_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # pgAdmin opsional -- UI untuk lihat isi database tanpa command line, buka di browser: http://localhost:8081
  pgadmin:
    image: dpage/pgadmin4
    container_name: reconciliation_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.test
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    depends_on:
      - postgres

volumes:
  reconciliation_pg_data:
